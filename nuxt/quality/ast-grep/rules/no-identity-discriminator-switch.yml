id: no-identity-discriminator-switch
language: TypeScript
severity: error
message: Discriminator branches must perform a real transformation.
note: Return the already-derived view directly when every branch reconstructs the same value.
files:
  - "app/**/*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
  - "app/**/*.vue"
  - "server/**/*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
  - "shared/**/*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
ignores:
  - "app/lib/api/generated/**"
rule:
  all:
    - pattern:
        context: |
          switch ($DISCRIMINANT) {
            case $SECOND:
              return { mode: $MODE, response: $RESPONSE }
          }
        selector: switch_case
    - follows:
        stopBy: end
        pattern:
          context: |
            switch ($DISCRIMINANT) {
              case $FIRST:
                return { mode: $MODE, response: $RESPONSE }
            }
          selector: switch_case
    - inside:
        stopBy: end
        kind: switch_statement
