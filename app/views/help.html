<div
    class="help_content content unbox page-help"
    scroll-to="$ctrl.ankare"
    offset="40"
    ng-bind-html="$ctrl.htmlContent | trust"
>
    <div toolkit>
        <ul class="help_submenu sticky">
            <li ng-repeat="item in $ctrl.labelArray">
                <a ng-click="$ctrl.onNavClick(item.id)">{{item.label}}</a>
            </li>
        </ul>

    </div>
</div>
